name = "patternlike-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
# Ajv compiles only the bundled, frozen M0 schemas at module startup. Keep the
# opt-in narrow: user input is data, never a schema, so it cannot supply code
# to this capability.
compatibility_flags = ["nodejs_compat", "allow_eval_during_startup"]

# Local / default D1 binding. The id here is a deliberate non-resolving
# placeholder, NOT an oversight: `--local` uses it only as a state-directory key,
# so local development works with any value, while a `wrangler d1 execute
# --remote` that forgets `--env production` fails with a 404 instead of reaching
# production data. The real id lives in [[env.production.d1_databases]] below.
[[d1_databases]]
binding = "DB"
database_name = "patternlike-ops"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../db/d1"

# Immutable artifacts: signed editorial release bundles today, chart renders and
# exports later. The default name is deliberately not the production bucket, so
# a remote development command cannot reserve an immutable production key. The
# real bucket is declared in [[env.production.r2_buckets]] below.
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "pattern-artifacts-dev"

# Signed, content-free Pattern lifecycle intents live outside D1 Time Travel
# and outside the general artifact bucket by construction.
[[r2_buckets]]
binding = "PATTERN_REPLAY_LEDGER"
bucket_name = "pattern-erasure-replay-dev"

# Private ontology-signing identity. The target has no route and owns the
# PATTERN_ONTOLOGY_SIGNING_KEY secret; this Worker never receives that secret.
[[services]]
binding = "ONTOLOGY_SIGNER"
service = "patternlike-ontology-signer"

# Evaluation artifacts are AES-256-GCM envelopes. Decrypting them uses
# ONTOLOGY_PIPELINE_ARTIFACT_KEYRING, a Worker secret, never a var:
#   wrangler secret put ONTOLOGY_PIPELINE_ARTIFACT_KEYRING
#   wrangler secret put ONTOLOGY_PIPELINE_ARTIFACT_KEYRING --env production
# Shape: {"version":1,"keys":{"<key_id>":"<unpadded base64url 32-byte AES key>"}}
# Machine ingestions fail closed if this secret is missing or malformed.
# Synthetic/internal ingestions do not read it. Named environments do not
# inherit secrets, so the production Worker needs its own put.

# Daily-reading generation. Producer and consumer are the same Worker: enqueue
# reserves the day in D1 and sends an opaque {job_id, reading_id}, and the
# consumer claims that job and publishes.
#
# The queue is a NUDGE, not the durable record. The D1 job row is the outbox, so
# a message lost before send is recovered by the undispatched sweeper and a
# message delivered twice is absorbed by the claim CAS. Nothing treats a send
# response as proof that generation completed.
#
# Dev-named queues for the same reason the D1 id is a placeholder and the R2
# bucket is `-dev`: a remote command that forgets `--env production` must not
# reach production work. Create both before the first deploy —
# `wrangler queues create patternlike-daily-readings-dev` and
# `wrangler queues create patternlike-daily-readings-dev-dlq` — or the upload fails
# on an unknown queue.
[[queues.producers]]
binding = "READING_QUEUE"
queue = "patternlike-daily-readings-dev"

[[queues.consumers]]
queue = "patternlike-daily-readings-dev"
# One at a time: each message decrypts a command, runs the assembler, and writes
# a guarded batch. Batching would only widen the blast radius of a retry.
max_batch_size = 1
max_batch_timeout = 5
# Bound local/default queue fan-out to the publisher's intended concurrency. The
# production consumer below is declared but deliberately left at its incumbent
# concurrency: raising it is part of the rollout's cost gate, not of shipping the
# code.
max_concurrency = 4
# Three attempts, then the dead-letter queue. Beyond that a retry is no longer
# waiting out an outage, and the replacement path — which re-freezes a NEW
# command against working dependencies — is the correct repair.
max_retries = 3
dead_letter_queue = "patternlike-daily-readings-dev-dlq"

# Privacy lifecycle work has its own queue. Messages contain only the closed
# {kind, job_id, job_type} nudge; encrypted commands and checkpoints stay in D1.
[[queues.producers]]
binding = "PRIVACY_QUEUE"
queue = "patternlike-privacy-dev"

[[queues.consumers]]
queue = "patternlike-privacy-dev"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 2
max_retries = 3
dead_letter_queue = "patternlike-privacy-dev-dlq"

# M7 AI-generated Pattern. Dedicated queue so long-form generation does not
# contend with daily-reading latency. Create both before the first deploy that
# declares them — `wrangler queues create patternlike-pattern-generation-dev`
# and `wrangler queues create patternlike-pattern-generation-dev-dlq` — or the
# upload fails on an unknown queue. max_concurrency = 2 is the conservative
# launch default (spec §25.4 left the exact figure to operators).
[[queues.producers]]
binding = "PATTERN_QUEUE"
queue = "patternlike-pattern-generation-dev"

[[queues.consumers]]
queue = "patternlike-pattern-generation-dev"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 2
max_retries = 3
dead_letter_queue = "patternlike-pattern-generation-dev-dlq"

# Automated ontology generation has its own one-message control-plane queue.
# The body is only {run_id, stage_generation}; D1 owns the command and outbox.
# Concurrency one is intentional while generator/evaluator/regression calls
# share one daily ceiling. Create this queue and its DLQ only as a separately
# approved operational prerequisite; this change performs no remote action.
[[queues.producers]]
binding = "ONTOLOGY_PIPELINE_QUEUE"
queue = "patternlike-ontology-pipeline-dev"

[[queues.consumers]]
queue = "patternlike-ontology-pipeline-dev"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3
dead_letter_queue = "patternlike-ontology-pipeline-dev-dlq"

# Keep incumbent and ontology D1 maintenance in separate invocations in the
# local/default environment. Production explicitly stays empty until its
# separately approved activation step installs both intended schedules.
[triggers]
crons = ["*/15 * * * *", "7,22,37,52 * * * *"]

# Default (development) vars. A bare `wrangler deploy` uses these, which is why
# `npm run deploy` targets the production environment explicitly and the
# configGuard middleware refuses AUTH_STUB=1 outside development.
[vars]
ENVIRONMENT = "development"
AUTH_STUB = "1"
CALC_SERVICE_URL = "http://127.0.0.1:8080"
SCHEMA_VERSION = "0.2.0"
# M0 decision: AGPL public SE — docs/legal/SWISS_EPHEMERIS_LICENSE_DECISION.md
SE_LICENSE_MODE = "agpl"
# Identity. Placeholders for local development only — AUTH_STUB=1 means the
# session exchange is not on the critical path here. configGuard refuses these
# values outside development, so a deploy cannot inherit them by accident.
# The vitest pool reads this block, so tests get a well-formed URL rather than
# undefined; a real key set is never fetched because outbound fetches are mocked.
OIDC_ISSUER = "https://issuer.invalid"
OIDC_AUDIENCE = "patternlike-dev"
OIDC_JWKS_URL = "https://issuer.invalid/.well-known/jwks.json"
# Constrained-model reading generation. Explicitly OFF rather than absent, for
# the same reason AUTH_STUB is written out as "0" below: an omitted var trains
# the reader to ignore wrangler's "vars exist at the top level" warning, which
# is the one channel that would report a genuinely forgotten one.
#
# `off` is the kill switch AND the schema-compatible state: every publisher
# variable and OPENAI_API_KEY may be absent while it holds, and the dual v3/v5
# readers still serve. checkSecureConfig validates any value that IS present
# regardless of the mode, so a typo cannot lie dormant until enablement day.
#
# The local canary sets this to `internal` in .dev.vars alongside a real key.
READING_V5_ROLLOUT = "off"
# Cloudflare AI Gateway, in front of the provider. Empty means direct calls to
# api.openai.com, which is what the vitest pool reading this block gets.
#
# Both or neither: checkSecureConfig refuses one without the other rather than
# silently calling the provider directly, which would look like a working
# deployment with an empty gateway dashboard. AI_GATEWAY_TOKEN is a secret and
# is set only when the gateway has Authenticated Gateway on.
AI_GATEWAY_ACCOUNT_ID = ""
AI_GATEWAY_ID = ""
# OPENAI_CREDENTIAL_SOURCE — `worker` or `gateway_stored`. Required whenever a
#            rollout is not `off`. NEVER inferred from whether OPENAI_API_KEY is
#            set: inference cannot tell "the stored key is in use" from "the
#            worker key was forgotten", and those need opposite outcomes.
#            `worker` is today's behaviour exactly — the Worker's own key rides
#            Authorization. Moving to `gateway_stored` is a SEPARATE release and
#            must change four things in ONE Worker version: both gateway ids
#            become non-empty, OPENAI_GATEWAY_KEY_ALIAS becomes non-empty,
#            AI_GATEWAY_TOKEN becomes available, and OPENAI_API_KEY is absent
#            from that same version. `wrangler secret delete` deploys
#            immediately, so deleting the old key first breaks `worker` mode,
#            and deploying `gateway_stored` first is refused while the key is
#            still present. Do not improvise that sequence in production.
OPENAI_CREDENTIAL_SOURCE = "worker"
# OPENAI_GATEWAY_KEY_ALIAS — the BYOK alias, sent as cf-aig-byok-alias. Empty in
#            `worker` mode; required in `gateway_stored`. Pinned explicitly
#            rather than left to the gateway's implicit `default` alias, so
#            adding a second stored key later cannot silently change which
#            credential runs.
OPENAI_GATEWAY_KEY_ALIAS = ""

CHECK_IN_RETENTION_MONTHS = "13"
TIME_TRAVEL_RECEIPT_EPOCH = "1"
TIME_TRAVEL_DAILY_SCAN_LIMIT = "32"
# M7 Pattern generation. Explicitly OFF rather than absent. `synthetic` is the
# local/test publisher and is refused outside development by checkSecureConfig.
# Production stays off until queues exist and an ontology release is activated.
# Accepted values are off | internal | first_open | enabled. Anything else fails
# checkSecureConfig, which answers 503 on every path including POST /v1/sessions.
# first_open admits accounts with no editorial Pattern to lose; enabled is the
# switch that moves accounts that still have one.
PATTERN_AI_ROLLOUT = "off"
PATTERN_INTERNAL_ACCOUNT_IDS = ""
PATTERN_PUBLISHER = "synthetic"
OPENAI_PATTERN_PLANNER_MODEL = "gpt-5.6-sol"
OPENAI_PATTERN_PLANNER_REASONING = "high"
OPENAI_PATTERN_PLANNER_PROMPT_VERSION = "1.0.0"
OPENAI_PATTERN_PLANNER_TIMEOUT_MS = "120000"
OPENAI_PATTERN_PLANNER_MAX_OUTPUT_TOKENS = "4000"
OPENAI_PATTERN_WRITER_MODEL = "gpt-5.6-sol"
OPENAI_PATTERN_WRITER_REASONING = "high"
OPENAI_PATTERN_WRITER_PROMPT_VERSION = "1.0.0"
OPENAI_PATTERN_WRITER_TIMEOUT_MS = "120000"
OPENAI_PATTERN_WRITER_MAX_OUTPUT_TOKENS = "8000"
OPENAI_PATTERN_VERIFIER_MODEL = "gpt-5.6-sol"
OPENAI_PATTERN_VERIFIER_REASONING = "high"
# Verifier prompt version differs from the writer tuple on purpose: the two
# passes must not be the same compiled prompt even when they share a model.
OPENAI_PATTERN_VERIFIER_PROMPT_VERSION = "1.0.0-verifier"
OPENAI_PATTERN_VERIFIER_TIMEOUT_MS = "120000"
OPENAI_PATTERN_VERIFIER_MAX_OUTPUT_TOKENS = "4000"
PATTERN_INPUT_MAX_BYTES = "98304"
# Conservative launch ceiling. Three provider calls per generation, once per
# chart; 100 UTC-day calls is an operator-replaceable default, not a spend
# approval for production enablement.
PATTERN_DAILY_PROVIDER_CALL_LIMIT = "100"
PATTERN_ARTIFACT_RETENTION_DAYS = "30"

# Automated ontology pipeline. This is an operator-only control-plane path,
# never a user-triggered generation mode. Keep it explicitly off in every
# Wrangler block until the internal run gate is approved. The generator and
# evaluator deliberately use distinct compiled prompts; their current model
# pin is equal only with this explicit acknowledgement, which freezes the
# stricter 100% per-class regression threshold into a run command.
ONTOLOGY_PIPELINE_ROLLOUT = "off"
ONTOLOGY_PIPELINE_ALLOW_EQUAL_MODELS = "1"
OPENAI_ONTOLOGY_GENERATOR_MODEL = "gpt-5.6-sol"
OPENAI_ONTOLOGY_GENERATOR_REASONING = "high"
OPENAI_ONTOLOGY_GENERATOR_PROMPT_VERSION = "1.0.5"
OPENAI_ONTOLOGY_GENERATOR_TIMEOUT_MS = "120000"
OPENAI_ONTOLOGY_GENERATOR_MAX_OUTPUT_TOKENS = "8000"
OPENAI_ONTOLOGY_EVALUATOR_MODEL = "gpt-5.6-sol"
OPENAI_ONTOLOGY_EVALUATOR_REASONING = "high"
OPENAI_ONTOLOGY_EVALUATOR_PROMPT_VERSION = "1.0.0-evaluator"
OPENAI_ONTOLOGY_EVALUATOR_TIMEOUT_MS = "120000"
OPENAI_ONTOLOGY_EVALUATOR_MAX_OUTPUT_TOKENS = "4000"
ONTOLOGY_PIPELINE_INPUT_MAX_BYTES = "98304"
ONTOLOGY_PIPELINE_DAILY_PROVIDER_CALL_LIMIT = "500"
ONTOLOGY_PIPELINE_FAILED_ARTIFACT_RETENTION_DAYS = "7"

# Named environments do not inherit top-level bindings, so D1 is redeclared.
[env.production]
name = "patternlike-api-production"

# An explicit override, not an omission. Top-level [triggers] declares both
# development crons, and a named environment inherits them when it does not say
# otherwise. Production enables only the separately approved ontology-pipeline
# maintenance lane; the incumbent reading/privacy/Pattern scheduler remains off.
[env.production.triggers]
crons = ["7,22,37,52 * * * *"]

[env.production.vars]
ENVIRONMENT = "production"
CALC_SERVICE_URL = "https://patternlike-calc.fly.dev"
SCHEMA_VERSION = "0.2.0"
SE_LICENSE_MODE = "agpl"
# Identity — Auth0 tenant dev-lqmwkyo17nm5mdjz, SPA app "Pattern/Like Web"
# (authorization_code + PKCE, RS256, token_endpoint_auth_method=none).
# Not secrets: the JWKS document is public and the client id of a public SPA
# client is not a credential.
#
# Values copied verbatim from the tenant's discovery document
# (/.well-known/openid-configuration), not typed by hand. OIDC_ISSUER is
# compared with strict equality in services/identity.ts and Auth0's `iss`
# carries a TRAILING SLASH — dropping it rejects every token as an opaque 401.
#
# OIDC_AUDIENCE is the SPA client id because the code verifies an ID token.
# An Auth0 API Audience would produce an access token with a different `aud`
# that never verifies.
#
# !! CHANGING OIDC_ISSUER ORPHANS EVERY EXISTING USER !!
# db/identities.ts looks accounts up by (provider, provider_subject) where
# provider IS this issuer string. Repointing at a production tenant or a custom
# domain makes every returning user unrecognised, minting them a fresh user id
# and crypto subject while their encrypted birth data stays sealed under the
# old subject. This is a dev-prefixed Auth0 tenant; migrate to a production
# tenant BEFORE the first real user, or plan an identities-table rewrite.
OIDC_ISSUER = "https://dev-lqmwkyo17nm5mdjz.us.auth0.com/"
OIDC_AUDIENCE = "bW9j2G79rWfKg2WDuAZdvi4EsS75ajcZ"
OIDC_JWKS_URL = "https://dev-lqmwkyo17nm5mdjz.us.auth0.com/.well-known/jwks.json"
# Explicitly OFF rather than absent. Every read is `AUTH_STUB === "1"`
# (middleware/auth.ts, middleware/config-guard.ts, routes/health.ts), so "0" is
# functionally identical to omitting it — but omitting it made wrangler warn
# `vars exist at the top level, but not on "env.production.vars"` on EVERY
# production deploy, which trains the reader to ignore the one channel that
# would report a genuinely forgotten var.
#
# Only "1" re-enables auth that trusts an unauthenticated X-User-Id header, and
# configGuard turns that value into a hard 503 on every request here regardless.
AUTH_STUB = "0"
# Constrained-model reading generation. Advanced one step at a time, each step a
# separate configuration change with its own gate:
#   off        dual readers only. No V2 reservation from any entry point.
#   internal   authenticated internal reservations, for one consented account.
#   first_open PUT /v1/readings/today may reserve.
#   hybrid     the 15-minute scheduler may reserve. Requires the production
#              cron, which below is an explicit `crons = []` OVERRIDE rather
#              than an omission: wrangler inherits top-level triggers into a
#              named environment, so leaving the block out would have inherited
#              the development schedule straight into production.
#
# Leaving `off` also requires READING_PUBLISHER, the five pinned OPENAI_READING_*
# and READING_* values, an operator-approved READING_DAILY_PROVIDER_CALL_LIMIT,
# and the OPENAI_API_KEY secret. checkSecureConfig refuses every request until
# all of them are set, which is the intended failure: half-configured generation
# would reach a provider with values no frozen command described.
READING_V5_ROLLOUT = "first_open"
# Cloudflare AI Gateway. Empty is the shipped state: the M5 design recorded
# direct provider calls as the launch decision and a gateway as an open one
# (platform spec v0.5 §16.3). Filling both in is the whole switch — the frozen
# publisher pin does not name a route, so commands frozen before and after
# describe the same prose.
#
# The adapter sends `cf-aig-collect-log: false` on every gateway request,
# because gateway logs store the prompt and the response verbatim and platform
# spec v0.2 §10 disables logging for private synthesis. Turning logs on at the
# gateway level does NOT override that; the request header wins, by design.
AI_GATEWAY_ACCOUNT_ID = ""
AI_GATEWAY_ID = ""
# OPENAI_CREDENTIAL_SOURCE — `worker` or `gateway_stored`. Required whenever a
#            rollout is not `off`. NEVER inferred from whether OPENAI_API_KEY is
#            set: inference cannot tell "the stored key is in use" from "the
#            worker key was forgotten", and those need opposite outcomes.
#            `worker` is today's behaviour exactly — the Worker's own key rides
#            Authorization. Moving to `gateway_stored` is a SEPARATE release and
#            must change four things in ONE Worker version: both gateway ids
#            become non-empty, OPENAI_GATEWAY_KEY_ALIAS becomes non-empty,
#            AI_GATEWAY_TOKEN becomes available, and OPENAI_API_KEY is absent
#            from that same version. `wrangler secret delete` deploys
#            immediately, so deleting the old key first breaks `worker` mode,
#            and deploying `gateway_stored` first is refused while the key is
#            still present. Do not improvise that sequence in production.
OPENAI_CREDENTIAL_SOURCE = "worker"
# OPENAI_GATEWAY_KEY_ALIAS — the BYOK alias, sent as cf-aig-byok-alias. Empty in
#            `worker` mode; required in `gateway_stored`. Pinned explicitly
#            rather than left to the gateway's implicit `default` alias, so
#            adding a second stored key later cannot silently change which
#            credential runs.
OPENAI_GATEWAY_KEY_ALIAS = ""

CHECK_IN_RETENTION_MONTHS = "13"
TIME_TRAVEL_RECEIPT_EPOCH = "1"
TIME_TRAVEL_DAILY_SCAN_LIMIT = "32"
# Pattern stays off in production until queues exist, ontology is activated,
# and an operator-approved spend ceiling is recorded. Declaring the pins here
# means a typo fails closed on the next request rather than at enablement.
# Accepted values are off | internal | first_open | enabled. Anything else fails
# checkSecureConfig, which answers 503 on every path including POST /v1/sessions.
# first_open admits accounts with no editorial Pattern to lose; enabled is the
# switch that moves accounts that still have one.
PATTERN_AI_ROLLOUT = "off"
PATTERN_INTERNAL_ACCOUNT_IDS = ""
PATTERN_PUBLISHER = "openai"
OPENAI_PATTERN_PLANNER_MODEL = "gpt-5.6-sol"
OPENAI_PATTERN_PLANNER_REASONING = "high"
OPENAI_PATTERN_PLANNER_PROMPT_VERSION = "1.0.0"
OPENAI_PATTERN_PLANNER_TIMEOUT_MS = "120000"
OPENAI_PATTERN_PLANNER_MAX_OUTPUT_TOKENS = "4000"
OPENAI_PATTERN_WRITER_MODEL = "gpt-5.6-sol"
OPENAI_PATTERN_WRITER_REASONING = "high"
OPENAI_PATTERN_WRITER_PROMPT_VERSION = "1.0.0"
OPENAI_PATTERN_WRITER_TIMEOUT_MS = "120000"
OPENAI_PATTERN_WRITER_MAX_OUTPUT_TOKENS = "8000"
OPENAI_PATTERN_VERIFIER_MODEL = "gpt-5.6-sol"
OPENAI_PATTERN_VERIFIER_REASONING = "high"
OPENAI_PATTERN_VERIFIER_PROMPT_VERSION = "1.0.0-verifier"
OPENAI_PATTERN_VERIFIER_TIMEOUT_MS = "120000"
OPENAI_PATTERN_VERIFIER_MAX_OUTPUT_TOKENS = "4000"
PATTERN_INPUT_MAX_BYTES = "98304"
PATTERN_DAILY_PROVIDER_CALL_LIMIT = "100"
PATTERN_ARTIFACT_RETENTION_DAYS = "30"
# Public verification material for machine ontology releases. The matching
# private key exists only on patternlike-ontology-signer-production.
PATTERN_ONTOLOGY_KEYS = '{"ontology-machine-2026-08":{"alg":"Ed25519","public_key":"Tn_Znz14aq2viq6CGwdI1b1xLV2jp-IR_OwI7nKDSp8"}}'

# Automated ontology pipeline. Internal control-plane execution was approved on
# 2026-08-22 for the 60-fragment Gate 7B candidate. This does not admit consumer
# Pattern generation; PATTERN_AI_ROLLOUT remains the independent product switch.
# The artifact keyring remains a Worker secret declared above, never a var.
ONTOLOGY_PIPELINE_ROLLOUT = "internal"
ONTOLOGY_PIPELINE_ALLOW_EQUAL_MODELS = "1"
OPENAI_ONTOLOGY_GENERATOR_MODEL = "gpt-5.6-sol"
OPENAI_ONTOLOGY_GENERATOR_REASONING = "high"
OPENAI_ONTOLOGY_GENERATOR_PROMPT_VERSION = "1.0.5"
OPENAI_ONTOLOGY_GENERATOR_TIMEOUT_MS = "120000"
OPENAI_ONTOLOGY_GENERATOR_MAX_OUTPUT_TOKENS = "8000"
OPENAI_ONTOLOGY_EVALUATOR_MODEL = "gpt-5.6-sol"
OPENAI_ONTOLOGY_EVALUATOR_REASONING = "high"
OPENAI_ONTOLOGY_EVALUATOR_PROMPT_VERSION = "1.0.0-evaluator"
OPENAI_ONTOLOGY_EVALUATOR_TIMEOUT_MS = "120000"
OPENAI_ONTOLOGY_EVALUATOR_MAX_OUTPUT_TOKENS = "4000"
ONTOLOGY_PIPELINE_INPUT_MAX_BYTES = "98304"
ONTOLOGY_PIPELINE_DAILY_PROVIDER_CALL_LIMIT = "500"
ONTOLOGY_PIPELINE_FAILED_ARTIFACT_RETENTION_DAYS = "7"

# The pinned publisher tuple. Every value is compared for EQUALITY against the
# compiled constant in services/reading-publisher.ts, not merely for presence:
# a frozen command records the values it was built under, and a deployed
# variable that drifts from the code would reach the provider describing
# something no command actually pinned. checkSecureConfig validates each one
# whether or not the rollout is `off`, so a typo here fails the next request
# rather than lying dormant until enablement day.
READING_PUBLISHER = "openai"
OPENAI_READING_MODEL = "gpt-5.6-sol"
OPENAI_READING_REASONING = "high"
OPENAI_READING_PROMPT_VERSION = "1.0.1"
OPENAI_READING_TIMEOUT_MS = "90000"
OPENAI_READING_MAX_OUTPUT_TOKENS = "4000"
READING_CONTEXT_MAX_BYTES = "98304"
READING_PREGEN_ACTIVE_DAYS = "30"
READING_PREGEN_LEAD_MINUTES = "30"
READING_PREGEN_SPREAD_MINUTES = "45"
READING_SCHEDULER_BATCH_LIMIT = "100"

# The operator-approved daily provider call ceiling, per UTC date, counted in
# reading_provider_daily_usage and NOT keyed by user. Approved at 10,000 by
# Henry Perkins on 2026-08-11.
#
# Measured basis, from the first real end-to-end generation rather than an
# estimate: 9,953 input and 2,413 output tokens for one reading. The response
# ceiling of 4,000 bounds the output term and counts reasoning together with
# visible output, so worst-case daily spend is
#   10,000 x (input_price x 9,953 + output_price x 4,000)
# at the current published gpt-5.6-sol rates. Re-cost this line on any model or
# price change; the number is an approval, not a default.
#
# Exhaustion is fail-closed and terminal for the UTC day: the product answers
# 503 publisher_budget_exhausted with retryable false rather than degrading to
# something ungrounded.
READING_DAILY_PROVIDER_CALL_LIMIT = "10000"

# The PWA ships inside this Worker, so the app and the API share one origin.
#
# Why this and not a proxy: sessions ride an httpOnly cookie with
# SameSite=Strict and Path=/v1 (routes/sessions.ts). Cross-origin would make it
# a third-party cookie, which Safari's ITP blocks. Serving both from one Worker
# makes same-origin structural rather than something a proxy has to preserve.
#
# `assets` is scoped to [env.production] on purpose: @cloudflare/vitest-pool-
# workers loads this file, and a top-level assets.directory pointing at a
# apps/web/dist that has not been built would break the test suite.
#
# run_worker_first lists EVERY path the Hono app serves. A path missing here is
# not a 404 — static assets answer first and not_found_handling returns
# index.html with a 200, so a forgotten route silently serves HTML to an API
# client. Keep this in sync with src/index.ts.
#
# Requires wrangler >= 4.20.0 for the array form (repo is on 4.116.0).
# Build apps/web before deploying: the directory must exist at upload time.
[env.production.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = [ "/health", "/v1/*", "/internal/*", "/admin/*" ]

# Real database, created 2026-08-08 in region ENAM. Schema applied with
# `wrangler d1 execute patternlike-ops --env production --remote --file=...`.
[[env.production.d1_databases]]
binding = "DB"
database_name = "patternlike-ops"
database_id = "1305a75d-0a8a-4a21-b201-d94fda0aaf93"
migrations_dir = "../../db/d1"

[[env.production.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "pattern-artifacts"

[[env.production.r2_buckets]]
binding = "PATTERN_REPLAY_LEDGER"
bucket_name = "pattern-erasure-replay"

[[env.production.services]]
binding = "ONTOLOGY_SIGNER"
service = "patternlike-ontology-signer-production"
# Target Worker must already exist. Deploy with `npm run deploy:signer` first.

# Redeclared because named environments do not inherit top-level bindings — the
# same reason D1 and R2 appear twice above. A production deploy that inherited
# the dev queue would publish real readings off a queue nobody watches.
[[env.production.queues.producers]]
binding = "READING_QUEUE"
queue = "patternlike-daily-readings"

[[env.production.queues.consumers]]
queue = "patternlike-daily-readings"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "patternlike-daily-readings-dlq"

[[env.production.queues.producers]]
binding = "PRIVACY_QUEUE"
queue = "patternlike-privacy"

[[env.production.queues.consumers]]
queue = "patternlike-privacy"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "patternlike-privacy-dlq"

[[env.production.queues.producers]]
binding = "PATTERN_QUEUE"
queue = "patternlike-pattern-generation"

[[env.production.queues.consumers]]
queue = "patternlike-pattern-generation"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 2
max_retries = 3
dead_letter_queue = "patternlike-pattern-generation-dlq"

# Named environments do not inherit queues. Keep production entirely distinct
# from the development control plane and preserve the same one-delivery lease.
[[env.production.queues.producers]]
binding = "ONTOLOGY_PIPELINE_QUEUE"
queue = "patternlike-ontology-pipeline"

[[env.production.queues.consumers]]
queue = "patternlike-ontology-pipeline"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3
dead_letter_queue = "patternlike-ontology-pipeline-dlq"

# Workers Logs / Traces. Declared here so a deploy cannot silently reset what
# the dashboard currently has: observability is part of the uploaded metadata,
# so whatever this file says (or omits) wins on every `npm run deploy:api`.
#
# The shape mirrors the live production settings verbatim, so applying it is a
# no-op today. It reads oddly on purpose: the parent `enabled = false` does not
# turn logging off, because the nested [.logs] and [.traces] tables govern their
# own signals independently. Logs on, traces off.
#
# persist = true means the signal is stored in the Cloudflare dashboard (billed
# separately) rather than only forwarded to an export destination — and there
# are no OTel destinations configured, so persist is the only reason anything is
# queryable at all. head_sampling_rate = 1 logs 100% of requests; drop it toward
# 0.1 if volume ever becomes a cost problem.
#
# Scoped to [env.production] to match every other binding in this file: the
# default environment is local development, where these settings do nothing.
[env.production.observability]
enabled = false
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
# Adds the per-request invocation summary (status, CPU time, wall time) beside
# whatever the Worker console.log()s. Worth keeping: the error envelope logs the
# real rejection reason server-side and returns a generic code, so the log is
# the only place a 401/calc_failed cause is visible.
invocation_logs = true

# Traces are in open beta and free during the beta. Flipping enabled = true is
# the whole change if the calc round-trip ever needs latency attribution.
[env.production.observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

# CONTENT_RELEASE_KEYS is deliberately absent from both [vars] blocks. It holds
# the PUBLIC keys trusted to sign editorial release bundles — public material,
# so a var rather than a secret — but there is no meaningful placeholder for it:
# POST /internal/content-releases fails closed with 503 until real keys are set,
# in development too. Shape:
#   CONTENT_RELEASE_KEYS = '{"wp-release-key-1":{"alg":"Ed25519","public_key":"<base64url raw>"}}'
# Put it in [env.production.vars] once the WordPress signing key exists, and in
# .dev.vars for the local loop.
#
# Secrets (set via `wrangler secret put --env production`):
# ROOT_KEK — envelope encryption root key. Required: every request outside
#            development returns 503 until it is set, and it must not be the
#            development placeholder.
# SERVICE_AUTH_TOKEN — internal WordPress → CF release auth
# CALC_SERVICE_AUTH_TOKEN — shared bearer token for Worker → calc requests.
#            The calc service returns 503 on /v1/calculate in production until
#            the same value is set there: fly secrets set CALC_SERVICE_AUTH_TOKEN=…
# OPENAI_API_KEY — the reading publisher credential. A SECRET, never a var:
#            nothing in this file may ever carry it, and the candidate gate greps
#            for exactly that. Set it only when READING_V5_ROLLOUT leaves `off`,
#            and verify the pinned model against the same key first with
#            `npm run publisher:model:verify -w @patternlike/api`.
#
# NOTE ON ENVIRONMENT NAMING: isDevEnvironment() treats BOTH "development" and
# "test" as development, which disables configGuard and re-enables the
# X-User-Id header. A staging deployment must NOT set ENVIRONMENT = "test".

name = "patternlike-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
# Ajv compiles only the bundled, frozen M0 schemas at module startup. Keep the
# opt-in narrow: user input is data, never a schema, so it cannot supply code
# to this capability.
compatibility_flags = ["nodejs_compat", "allow_eval_during_startup"]

# Local / default D1 binding. The id here is a deliberate non-resolving
# placeholder, NOT an oversight: `--local` uses it only as a state-directory key,
# so local development works with any value, while a `wrangler d1 execute
# --remote` that forgets `--env production` fails with a 404 instead of reaching
# production data. The real id lives in [[env.production.d1_databases]] below.
[[d1_databases]]
binding = "DB"
database_name = "patternlike-ops"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../db/d1"

# Immutable artifacts: signed editorial release bundles today, chart renders and
# exports later. Production uses the pre-provisioned pattern-artifacts bucket.
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "pattern-artifacts"

# Default (development) vars. A bare `wrangler deploy` uses these, which is why
# `npm run deploy` targets the production environment explicitly and the
# configGuard middleware refuses AUTH_STUB=1 outside development.
[vars]
ENVIRONMENT = "development"
AUTH_STUB = "1"
CALC_SERVICE_URL = "http://127.0.0.1:8080"
SCHEMA_VERSION = "0.2.0"
# M0 decision: AGPL public SE — docs/legal/SWISS_EPHEMERIS_LICENSE_DECISION.md
SE_LICENSE_MODE = "agpl"
# Identity. Placeholders for local development only — AUTH_STUB=1 means the
# session exchange is not on the critical path here. configGuard refuses these
# values outside development, so a deploy cannot inherit them by accident.
# The vitest pool reads this block, so tests get a well-formed URL rather than
# undefined; a real key set is never fetched because outbound fetches are mocked.
OIDC_ISSUER = "https://issuer.invalid"
OIDC_AUDIENCE = "patternlike-dev"
OIDC_JWKS_URL = "https://issuer.invalid/.well-known/jwks.json"

# Named environments do not inherit top-level bindings, so D1 is redeclared.
[env.production]
name = "patternlike-api-production"

[env.production.vars]
ENVIRONMENT = "production"
CALC_SERVICE_URL = "https://patternlike-calc.fly.dev"
SCHEMA_VERSION = "0.2.0"
SE_LICENSE_MODE = "agpl"
# Identity — Auth0 tenant dev-lqmwkyo17nm5mdjz, SPA app "Pattern/Like Web"
# (authorization_code + PKCE, RS256, token_endpoint_auth_method=none).
# Not secrets: the JWKS document is public and the client id of a public SPA
# client is not a credential.
#
# Values copied verbatim from the tenant's discovery document
# (/.well-known/openid-configuration), not typed by hand. OIDC_ISSUER is
# compared with strict equality in services/identity.ts and Auth0's `iss`
# carries a TRAILING SLASH — dropping it rejects every token as an opaque 401.
#
# OIDC_AUDIENCE is the SPA client id because the code verifies an ID token.
# An Auth0 API Audience would produce an access token with a different `aud`
# that never verifies.
#
# !! CHANGING OIDC_ISSUER ORPHANS EVERY EXISTING USER !!
# db/identities.ts looks accounts up by (provider, provider_subject) where
# provider IS this issuer string. Repointing at a production tenant or a custom
# domain makes every returning user unrecognised, minting them a fresh user id
# and crypto subject while their encrypted birth data stays sealed under the
# old subject. This is a dev-prefixed Auth0 tenant; migrate to a production
# tenant BEFORE the first real user, or plan an identities-table rewrite.
OIDC_ISSUER = "https://dev-lqmwkyo17nm5mdjz.us.auth0.com/"
OIDC_AUDIENCE = "bW9j2G79rWfKg2WDuAZdvi4EsS75ajcZ"
OIDC_JWKS_URL = "https://dev-lqmwkyo17nm5mdjz.us.auth0.com/.well-known/jwks.json"
# AUTH_STUB is deliberately absent. Setting it here re-enables auth that trusts
# an unauthenticated X-User-Id header.

# The PWA ships inside this Worker, so the app and the API share one origin.
#
# Why this and not a proxy: sessions ride an httpOnly cookie with
# SameSite=Strict and Path=/v1 (routes/sessions.ts). Cross-origin would make it
# a third-party cookie, which Safari's ITP blocks. Serving both from one Worker
# makes same-origin structural rather than something a proxy has to preserve.
#
# `assets` is scoped to [env.production] on purpose: @cloudflare/vitest-pool-
# workers loads this file, and a top-level assets.directory pointing at a
# apps/web/dist that has not been built would break the test suite.
#
# run_worker_first lists EVERY path the Hono app serves. A path missing here is
# not a 404 — static assets answer first and not_found_handling returns
# index.html with a 200, so a forgotten route silently serves HTML to an API
# client. Keep this in sync with src/index.ts.
#
# Requires wrangler >= 4.20.0 for the array form (repo is on 4.116.0).
# Build apps/web before deploying: the directory must exist at upload time.
[env.production.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = [ "/health", "/v1/*", "/internal/*" ]

# Real database, created 2026-08-08 in region ENAM. Schema applied with
# `wrangler d1 execute patternlike-ops --env production --remote --file=...`.
[[env.production.d1_databases]]
binding = "DB"
database_name = "patternlike-ops"
database_id = "1305a75d-0a8a-4a21-b201-d94fda0aaf93"
migrations_dir = "../../db/d1"

[[env.production.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "pattern-artifacts"

# CONTENT_RELEASE_KEYS is deliberately absent from both [vars] blocks. It holds
# the PUBLIC keys trusted to sign editorial release bundles — public material,
# so a var rather than a secret — but there is no meaningful placeholder for it:
# POST /internal/content-releases fails closed with 503 until real keys are set,
# in development too. Shape:
#   CONTENT_RELEASE_KEYS = '{"wp-release-key-1":{"alg":"Ed25519","public_key":"<base64url raw>"}}'
# Put it in [env.production.vars] once the WordPress signing key exists, and in
# .dev.vars for the local loop.
#
# Secrets (set via `wrangler secret put --env production`):
# ROOT_KEK — envelope encryption root key. Required: every request outside
#            development returns 503 until it is set, and it must not be the
#            development placeholder.
# SERVICE_AUTH_TOKEN — internal WordPress → CF release auth
# CALC_SERVICE_AUTH_TOKEN — shared bearer token for Worker → calc requests.
#            The calc service returns 503 on /v1/calculate in production until
#            the same value is set there: fly secrets set CALC_SERVICE_AUTH_TOKEN=…
#
# NOTE ON ENVIRONMENT NAMING: isDevEnvironment() treats BOTH "development" and
# "test" as development, which disables configGuard and re-enables the
# X-User-Id header. A staging deployment must NOT set ENVIRONMENT = "test".

# Serves the built PWA out of /usr/share/nginx/html on :8080.
server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # The API is a Cloudflare Worker, not this host. Answer API paths with an
  # honest JSON 503 (ErrorBody shape) instead of letting the SPA fallback
  # serve the HTML shell as a 200 the client then fails to parse.
  location /v1/ {
    default_type application/json;
    return 503 '{"error":{"code":"api_unavailable","message":"The Pattern/Like API is not deployed behind this origin yet."}}';
  }

  # Vite emits content-hashed filenames under /assets — cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app shell and service worker must revalidate on every load, or a
  # deploy can be pinned out by a stale cached copy.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

openapi: 3.1.0
info:
  title: Pattern-Like Astrology App API
  version: 0.2.0
  description: |
    M0 OpenAPI stub for public `/v1` and internal content-release routes.
    Normative body shapes are defined in `contracts/m0/*.schema.json`
    (schema_version 0.2.0). This document wires routes, headers, and
    response envelopes to those frozen contracts.

    Spec: product platform v0.2 — all mutating endpoints require
    `Idempotency-Key` because queue delivery is at-least-once.
  contact:
    name: Pattern-Like Engineering
servers:
  - url: https://api.patternlike.app
    description: Production (placeholder)
  - url: http://localhost:8787
    description: Local Workers dev
tags:
  - name: sessions
  - name: birth
  - name: chart
  - name: readings
  - name: pattern
  - name: timing
  - name: context
  - name: privacy
  - name: internal
paths:
  /v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Exchange an OIDC ID token for a session
      description: >
        Unauthenticated by necessity — this is what mints the credential every
        other route requires — but still behind the configuration guard, so a
        development-shaped deployment answers 503 here like everywhere else.


        No `Idempotency-Key`. Every other mutating route carries one because
        queue delivery is at-least-once; this route enqueues nothing, and a
        replay mints an additional session row rather than duplicating an
        effect. Sessions are independently revocable, so that is harmless.


        Browsers receive an httpOnly `pl_session` cookie (`SameSite=Strict`,
        `Path=/v1`) and must ignore the `token` in the body: holding the same
        value in JavaScript reintroduces exactly the XSS exposure the cookie
        exists to prevent. Native clients use `token` as a bearer. Both resolve
        the same row.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionExchangeRequest'
      responses:
        '201':
          description: Session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /v1/sessions/current:
    delete:
      tags: [sessions]
      operationId: revokeCurrentSession
      summary: Log out — revoke the calling session
      description: >
        Idempotent: an absent, expired, or already-revoked credential still
        answers 204, and the cookie is cleared either way. Revocation is a row
        update, which is what makes "invalidate my sessions" a real control
        rather than a wait for token expiry.
      responses:
        '204':
          description: Session revoked and cookie cleared
        '503':
          $ref: '#/components/responses/Error'

  /v1/birth-profiles:
    post:
      tags: [birth]
      operationId: createOrUpdateBirthProfile
      summary: Create/update a birth profile and start calculation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthProfileRequest'
      responses:
        '202':
          description: Profile accepted; calculation workflow started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BirthProfileAccepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /v1/timezone-lookup:
    post:
      tags: [birth]
      operationId: lookupTimezone
      summary: Resolve a birthplace to the timezone in force on the birth date
      description: |
        Answers the same question `POST /v1/birth-profiles` answers internally,
        so onboarding can show the resolved zone before the user commits to it.

        POST rather than GET because the body carries a birth date and time —
        the values the rest of this API encrypts at rest — and a query string
        would put them in every access log between the browser and the Worker.
        Nothing is stored and there is no effect to repeat, so no
        `Idempotency-Key` is required.

        Coordinates decide the zone when they are present; `timezone_hint` is
        used only when they are not, and is reported back as `hint_overridden`
        when the birthplace disagreed with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimezoneLookupRequest'
      responses:
        '200':
          description: Resolved zone, the offset in force, and any caveats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimezoneLookupResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /v1/chart:
    get:
      tags: [chart]
      operationId: getChart
      summary: Return normalized natal facts and uncertainty summary
      description: |
        Response aligns with chart-contract `chartSnapshot` (redacted as needed).
        Contract: `chart-contract.schema.json#/$defs/chartSnapshot`
      responses:
        '200':
          description: Active chart snapshot summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartResponse'
        '404':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /v1/readings/today:
    get:
      tags: [readings]
      operationId: getTodayReading
      summary: Daily reading for the user local date
      responses:
        '200':
          description: Published daily reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReadingResponse'
        '404':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /v1/readings/{id}/evidence:
    get:
      tags: [readings]
      operationId: getReadingEvidence
      summary: Paragraph-level provenance
      description: |
        Contract: `reading-evidence.schema.json#/$defs/readingEvidenceGraph`
      parameters:
        - $ref: '#/components/parameters/ReadingId'
      responses:
        '200':
          description: Evidence graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingEvidenceGraph'
        '404':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /v1/readings/{id}/feedback:
    post:
      tags: [readings]
      operationId: postReadingFeedback
      summary: Record structured usefulness feedback
      parameters:
        - $ref: '#/components/parameters/ReadingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingFeedbackRequest'
      responses:
        '201':
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingFeedbackResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /v1/pattern:
    get:
      tags: [pattern]
      operationId: getPattern
      summary: Stable natal pattern chapters
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Paginated pattern chapters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternListResponse'
        '401':
          $ref: '#/components/responses/Error'

  /v1/timing:
    get:
      tags: [timing]
      operationId: getTiming
      summary: Active and upcoming cycle instances
      parameters:
        - name: phase
          in: query
          schema:
            type: string
            enum: [emerging, building, peak, reconsidering, integrating]
        - name: domain
          in: query
          schema:
            type: string
        - name: duration
          in: query
          schema:
            type: string
            enum: [short, medium, long]
      responses:
        '200':
          description: Cycle list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimingResponse'
        '401':
          $ref: '#/components/responses/Error'

  /v1/time-travel:
    get:
      tags: [timing]
      operationId: getTimeTravel
      summary: Reconstruct a selected date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Date reconstruction with separated fact/context layers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeTravelResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /v1/check-ins:
    post:
      tags: [context]
      operationId: postCheckIn
      summary: Store an explicit short-lived context signal
      description: |
        Creates a ContextSignal (typically USR-06). Contract:
        `context-signal.schema.json`
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '201':
          description: Context signal stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSignal'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /v1/context-sources:
    get:
      tags: [context]
      operationId: getContextSources
      summary: Inspect context source permissions
      description: |
        Contract: `consent.schema.json#/$defs/contextSourcesDocument`
      responses:
        '200':
          description: Source permission list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSourcesDocument'
        '401':
          $ref: '#/components/responses/Error'
    put:
      tags: [context]
      operationId: putContextSources
      summary: Enable, pause, or revoke sources
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextSourcesDocument'
      responses:
        '200':
          description: Updated permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSourcesDocument'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /v1/exports:
    post:
      tags: [privacy]
      operationId: startExport
      summary: Start portable account export
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: Export workflow accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
        '401':
          $ref: '#/components/responses/Error'

  /v1/account:
    delete:
      tags: [privacy]
      operationId: startDeletion
      summary: Start account deletion workflow
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '202':
          description: Deletion workflow accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
        '401':
          $ref: '#/components/responses/Error'

  /internal/content-releases:
    post:
      tags: [internal]
      operationId: ingestContentRelease
      summary: Receive signed WordPress release bundles
      description: |
        Service-authenticated only. Request body contract:
        `content-release.schema.json#/$defs/contentReleaseIngestionRequest`
        (embeds `contentReleaseBundle` plus idempotency_key / activate).
        Normative validation is the JSON Schema package, not the OAS stub envelope.
      security:
        - serviceAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentReleaseIngestionRequest'
      responses:
        '202':
          description: Bundle accepted for verification/activation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReleaseIngestionResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The opaque session token returned by `POST /v1/sessions`, for native
        clients. Not a JWT and not the identity provider's token: the OIDC
        id_token is spent once at the exchange and never presented again.
    sessionCookie:
      type: apiKey
      in: cookie
      name: pl_session
      description: >
        How browsers authenticate. Set httpOnly with `SameSite=Strict` and
        `Path=/v1` by the session exchange. `Path=/v1` is why the app and the
        API must share an origin — cross-origin makes this a third-party cookie
        that Safari's ITP blocks.
    serviceAuth:
      type: http
      scheme: bearer
      description: Internal service token for WordPress → Cloudflare release ingestion.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 256
      description: Required on all mutating endpoints.
    ReadingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 8
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Opaque error class for clients/ops; no private payloads.
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true

    SessionExchangeRequest:
      type: object
      additionalProperties: false
      required: [id_token]
      properties:
        id_token:
          type: string
          minLength: 1
          description: >
            A compact-serialisation OIDC ID token from the configured issuer.
            The Worker verifies the signature against the issuer's published
            key set and checks `iss`, `aud`, `exp`, and `nbf`; `iat` is
            deliberately not checked, because issuer clock skew is not a
            forgery signal and `exp` is what bounds the token's life.
            Asymmetric algorithms only — a symmetric one would let the token
            sign itself.

    SessionResponse:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: >
            Opaque session token for native clients. Browsers must ignore this
            and rely on the httpOnly cookie set alongside it.
        expires_at:
          type: string
          format: date-time
          description: >
            Absolute expiry, 30 days out. Not extended by use: sessions end on
            a fixed horizon rather than sliding, so an abandoned session has a
            bounded life.

    WorkflowAccepted:
      type: object
      additionalProperties: false
      required: [schema_version, workflow, status, idempotency_key]
      properties:
        schema_version:
          type: string
          const: '0.2.0'
        workflow:
          type: string
          enum:
            - NormalizeBirthAndCalculateChart
            - GenerateDailyReading
            - PublishContentRelease
            - ExportAccount
            - DeleteAccount
            - RefreshConnector
        status:
          type: string
          enum: [queued, running, succeeded, duplicate]
        idempotency_key:
          type: string
        job_id:
          type: [string, 'null']
        resource_id:
          type: [string, 'null']

    TimezoneQualifier:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - pre_1970_zone_boundary
            - near_zone_boundary
            - hint_replaced
            - no_coordinates
            - nautical_zone
            - local_time_ambiguous
            - local_time_nonexistent
          description: Opaque class, safe for logs and audit detail_class values.
        message:
          type: string

    ResolvedLocalTime:
      type: object
      additionalProperties: false
      required:
        - utc_instant
        - utc_offset_minutes
        - utc_offset_label
        - resolution
      properties:
        utc_instant:
          type: string
          format: date-time
        utc_offset_minutes:
          type: integer
        utc_offset_label:
          type: string
          description: Display form of the offset, e.g. "UTC-07:00".
        resolution:
          type: string
          enum: [unique, ambiguous, nonexistent]
          description: |
            `ambiguous` means the clock ran through this wall time twice at a
            daylight-saving fall-back and `utc_instant` is the first of the two;
            `nonexistent` means the clock skipped it and the instant given is
            the one just after the change.
        alternate_utc_instant:
          type: [string, 'null']
          format: date-time
        alternate_utc_offset_minutes:
          type: [integer, 'null']

    TimezoneLookupRequest:
      type: object
      additionalProperties: false
      description: Supply coordinates, a timezone_hint, or both.
      properties:
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
        birth_date:
          type: [string, 'null']
          format: date
        birth_time_local:
          type: [string, 'null']
        timezone_hint:
          type: [string, 'null']

    TimezoneLookupResponse:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - timezone
        - source
        - confidence
        - boundary_nearby
        - hint_overridden
        - tzdb_stable_from_year
        - local
        - qualifiers
      properties:
        schema_version:
          type: string
          const: '0.2.0'
        timezone:
          type: string
          description: IANA zone id, e.g. America/Los_Angeles.
        source:
          type: string
          enum: [coordinates, hint, default]
          description: |
            `coordinates` is a lookup against timezone boundaries; `hint` is the
            client's value, used only when no coordinates were supplied;
            `default` is the UTC fallback when there is neither.
        confidence:
          type: string
          enum: [high, medium, low, none]
          description: |
            Stored on `birth_profiles.geocode_confidence`. Reduced when the
            birthplace sits near a zone boundary or predates 1970. `none` means
            nothing was geocoded.
        boundary_nearby:
          type: boolean
        hint_overridden:
          type: [string, 'null']
          description: The client's timezone_hint, when coordinates overruled it.
        tzdb_stable_from_year:
          type: integer
          description: |
            First year tzdb guarantees the zone matches the location's clocks.
            A birth before it is qualified rather than presented as settled.
        local:
          oneOf:
            - $ref: '#/components/schemas/ResolvedLocalTime'
            - type: 'null'
          description: Null when no usable birth date was supplied.
        qualifiers:
          type: array
          items:
            $ref: '#/components/schemas/TimezoneQualifier'

    BirthProfileAccepted:
      type: object
      additionalProperties: false
      description: |
        WorkflowAccepted plus what the workflow produced synchronously. The
        `timezone` block reports the zone the chart was actually calculated in,
        which is not necessarily the `timezone_hint` that was posted.

        Spelled out rather than composed from WorkflowAccepted: that schema is
        `additionalProperties: false`, so an allOf branch would reject the two
        fields this one adds.
      required: [schema_version, workflow, status, idempotency_key]
      properties:
        schema_version:
          type: string
          const: '0.2.0'
        workflow:
          type: string
          enum:
            - NormalizeBirthAndCalculateChart
            - GenerateDailyReading
            - PublishContentRelease
            - ExportAccount
            - DeleteAccount
            - RefreshConnector
        status:
          type: string
          enum: [queued, running, succeeded, duplicate]
        idempotency_key:
          type: string
        job_id:
          type: [string, 'null']
        resource_id:
          type: [string, 'null']
        timezone:
          type: object
          additionalProperties: false
          required: [resolved, source, confidence, qualifiers]
          properties:
            resolved:
              type: string
            source:
              type: string
              enum: [coordinates, hint, default]
            confidence:
              type: string
              enum: [high, medium, low, none]
            hint_overridden:
              type: [string, 'null']
            qualifiers:
              type: array
              items:
                $ref: '#/components/schemas/TimezoneQualifier'
        chart:
          type: object
          additionalProperties: true
          description: |
            Present on status `succeeded`. Projection of the chart snapshot;
            full shape in chart-contract.schema.json#/$defs/chartSnapshot.
          properties:
            id:
              type: string
            fingerprint:
              type: string
            contract_id:
              type: string
            status:
              type: string
              enum: [active, superseded, invalid]
            uncertainty:
              type: object
              additionalProperties: true

    BirthProfileRequest:
      type: object
      additionalProperties: false
      required: [accuracy, consent_id]
      properties:
        accuracy:
          type: string
          enum: [exact, approximate, unknown]
        birth_date:
          type: string
          format: date
          description: Required when accuracy is exact or approximate.
        birth_time_local:
          type: [string, 'null']
          description: Local civil time HH:MM or HH:MM:SS; null when unknown.
        approximate_window_minutes:
          type: [integer, 'null']
          minimum: 1
        birthplace:
          type: object
          additionalProperties: false
          properties:
            label:
              type: string
            place_id:
              type: [string, 'null']
            latitude:
              type: [number, 'null']
            longitude:
              type: [number, 'null']
        timezone_hint:
          type: [string, 'null']
        consent_id:
          type: string
          minLength: 8

    ChartResponse:
      type: object
      description: |
        API projection of chartSnapshot. Full schema:
        contracts/m0/chart-contract.schema.json#/$defs/chartSnapshot
      additionalProperties: true
      required:
        - schema_version
        - id
        - fingerprint
        - contract_id
        - uncertainty
        - status
      properties:
        schema_version:
          type: string
          const: '0.2.0'
        id:
          type: string
        fingerprint:
          type: string
        contract_id:
          type: string
        contract_version:
          type: string
        status:
          type: string
          enum: [active, superseded, invalid]
        uncertainty:
          type: object
          additionalProperties: true
        positions:
          type: array
          items:
            type: object
            additionalProperties: true
        houses:
          type: [object, 'null']
        angles:
          type: [object, 'null']
        aspects:
          type: array
          items:
            type: object
            additionalProperties: true
      x-patternlike-contract: >-
        https://patternlike.app/contracts/m0/chart-contract.schema.json#/$defs/chartSnapshot

    DailyReadingResponse:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - id
        - reading_key
        - local_date
        - release_version
        - assembly_mode
        - status
        - paragraphs
      properties:
        schema_version:
          type: string
          const: '0.2.0'
        id:
          type: string
        reading_key:
          type: string
        local_date:
          type: string
          format: date
        release_version:
          type: string
        assembly_mode:
          type: string
          enum: [deterministic, constrained_model]
        status:
          type: string
        primary_theme:
          type: [object, 'null']
          additionalProperties: true
        supporting_theme:
          type: [object, 'null']
          additionalProperties: true
        paragraphs:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [paragraph_id, role, text]
            properties:
              paragraph_id:
                type: string
              role:
                type: string
              text:
                type: string
              evidence_lane:
                type: string
                enum: [celestial_facts, user_and_context, operational]

    ReadingEvidenceGraph:
      type: object
      description: |
        Full contract:
        contracts/m0/reading-evidence.schema.json#/$defs/readingEvidenceGraph
      additionalProperties: true
      required:
        - schema_version
        - reading_id
        - reading_key
        - paragraphs
        - validation
      properties:
        schema_version:
          type: string
          const: '0.2.0'
        reading_id:
          type: string
        reading_key:
          type: string
        paragraphs:

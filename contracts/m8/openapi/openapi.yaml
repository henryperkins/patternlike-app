      properties:
        query:
          type: string
          minLength: 2
          maxLength: 120
          pattern: '^\S(?:.*\S)?$'
        locale:
          type: [string, 'null']
          minLength: 2
          maxLength: 35
          pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]+)*$'
        session_token:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]+$'
    PlaceSearchCandidate:
      type: object
      additionalProperties: false
      required: [candidate_id, primary_label, secondary_label]
      properties:
        candidate_id: { type: string, minLength: 1, maxLength: 512 }
        primary_label: { type: string, minLength: 1, maxLength: 512 }
        secondary_label:
          type: [string, 'null']
          minLength: 1
          maxLength: 512
    PlaceSearchResponse:
      type: object
      additionalProperties: false
      required: [schema_version, candidates]
      properties:
        schema_version: { type: string, const: '0.8.0' }
        candidates:
          type: array
          minItems: 0
          maxItems: 8
          items: { $ref: '#/components/schemas/PlaceSearchCandidate' }
    PlaceResolutionRequest:
      type: object
      additionalProperties: false
      required: [candidate_id, session_token]
      properties:
        candidate_id: { type: string, minLength: 1, maxLength: 512 }
        locale:
          type: [string, 'null']
          minLength: 2
          maxLength: 35
          pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]+)*$'
        session_token:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]+$'
    PlaceQualifier:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [approximate_match, region_level_match]
        message: { type: string, minLength: 1, maxLength: 500 }
    PlaceResolutionResponse:
      type: object
      additionalProperties: false
      required:
        [schema_version, place_id, label, latitude, longitude,
         geocode_confidence, qualifiers]
      properties:
        schema_version: { type: string, const: '0.8.0' }
        place_id: { type: string, pattern: '^plc_[0-9a-f]{32}$' }
        label: { type: string, minLength: 1, maxLength: 512 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        geocode_confidence: { type: string, enum: [high, medium, low] }
        qualifiers:
          type: array
          minItems: 0
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/PlaceQualifier' }
    GeocoderConsentGrant:
      type: object
      additionalProperties: false
      required: [policy_version]
      properties:
        policy_version:
          type: string
          const: google-places-geocoding-v4-2026-08-26
    AccountProcessingConsentGrant:
      type: object
      additionalProperties: false
      required: [policy_version]
      properties:
        policy_version:
          type: string
          const: account-processing-v1-2026-08-28
    AccountProcessingConsent:
      type: object
      additionalProperties: false
      required:
        [schema_version, kind, source_id, permission_tier, allowed_uses,
         provider, scopes, connector_account_id, status, consent_id,
         account_status, regrant_will_restore_access, policy_version, granted_at,
         ui_surface, disclosure]
      properties:
        schema_version: { type: string, const: '0.8.0' }
        kind: { type: string, const: account_processing }
        source_id: { type: string, const: AST-01 }
        permission_tier: { type: integer, const: 0 }
        allowed_uses:
          type: array
          minItems: 3
          maxItems: 3
          prefixItems:
            - { type: string, const: chart_fact }
            - { type: string, const: cycle_detection }
            - { type: string, const: uncertainty_model }
          items: false
        provider: { type: 'null', const: null }
        scopes:
          type: array
          minItems: 0
          maxItems: 0
          items: false
        connector_account_id: { type: 'null', const: null }
        status: { type: string, enum: [granted, not_granted] }
        consent_id: { type: [string, 'null'], minLength: 8, maxLength: 128 }
        account_status: { type: string, enum: [active, frozen] }
        regrant_will_restore_access: { type: boolean }
        policy_version:
          type: string
          const: account-processing-v1-2026-08-28
        granted_at: { type: [string, 'null'], format: date-time }
        ui_surface:
          type: [string, 'null']
          enum: [onboarding, privacy_center, null]
        disclosure:
          type: object
          additionalProperties: false
          required: [text, links]
          properties:
            text:
              type: string
              const: "Pattern/Like uses the birth date, local birth time, accuracy choice, place label, coordinates, and timezone you submit to calculate your natal chart, timing cycles, and uncertainty. The API sends those values to Pattern/Like's calculation service; it does not send them to a generative model. Pattern/Like encrypts the submitted profile and retained birth fields under your account key while retaining the calculated chart facts needed by the product. Separate permissions govern generated readings, Your Pattern, research, and model training. You may withdraw this permission at any time. Withdrawal retains the account data but stops serving it by freezing the account; regrant, export, and account deletion remain available."
            links:
              type: object
              additionalProperties: false
              required: [patternlike_terms, patternlike_privacy]
              properties:
                patternlike_terms: { type: string, const: /terms.html }
                patternlike_privacy: { type: string, const: /privacy.html }
      oneOf:
        - properties:
            status: { const: granted }
            consent_id: { type: string, minLength: 8, maxLength: 128 }
            granted_at: { type: string, format: date-time }
            ui_surface: { type: string, enum: [onboarding, privacy_center] }
          required: [status, consent_id, granted_at, ui_surface]
        - properties:
            status: { const: not_granted }
            consent_id: { type: 'null' }
            granted_at: { type: 'null' }
            ui_surface: { type: 'null' }
          required: [status, consent_id, granted_at, ui_surface]
    GeocoderConsent:
      type: object
      additionalProperties: false
      required:
        [schema_version, kind, source_id, permission_tier, allowed_uses,
         provider, scopes, connector_account_id, status, policy_version,
         granted_at, ui_surface, disclosure]
      properties:
        schema_version: { type: string, const: '0.8.0' }
        kind: { type: string, const: product_source }
        source_id: { type: string, const: AST-02 }
        permission_tier: { type: integer, const: 0 }
        allowed_uses:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - { type: string, const: chart_fact }
            - { type: string, const: timezone_resolution }
          items: false
        provider: { type: string, const: google_places_geocoding_v4 }
        scopes:
          type: array
          minItems: 0
          maxItems: 0
          items: false
        connector_account_id: { type: 'null', const: null }
        status: { type: string, enum: [granted, not_granted] }
        policy_version:
          type: string
          const: google-places-geocoding-v4-2026-08-26
        granted_at: { type: [string, 'null'], format: date-time }
        ui_surface:
          type: [string, 'null']
          enum: [onboarding, privacy_center, null]
        disclosure:
          type: object
          additionalProperties: false
          required: [text, links]
          properties:
            text:
              type: string
              const: "Google birthplace search is optional. If you enable it, Pattern/Like sends the city or place text you type and your language preference (when available) to Google Places Autocomplete. After you choose a suggestion, Pattern/Like sends only Google's opaque Place ID to Google Geocoding. Pattern/Like does not send your birth date or time, coordinates or device location, Pattern/Like user, account, birth-profile, or consent identifiers, or the app-owned search session token. Google receives these requests, Pattern/Like's project credential, and network metadata such as the Worker IP. Google acts as an independent controller and may retain and use information it receives, including search terms and IP addresses, to provide and improve Google products and services; the reviewed terms do not promise to exclude model training. Pattern/Like does not store your query or unselected suggestions. It encrypts the selected formatted address, coordinates, confidence, and qualifiers under your account key and deletes that data with your Pattern/Like account, but account deletion does not delete Google's separately controlled records. You can decline or withdraw this permission and enter the place, coordinates, and time zone manually."
            links:
              type: object
              additionalProperties: false
              required:
                [patternlike_terms, patternlike_privacy, google_maps_terms,
                 google_privacy]
              properties:
                patternlike_terms: { type: string, const: /terms.html }
                patternlike_privacy: { type: string, const: /privacy.html }
                google_maps_terms:
                  type: string
                  const: 'https://maps.google.com/help/terms_maps/'
                google_privacy:
                  type: string
                  const: 'https://policies.google.com/privacy'
      oneOf:
        - properties:
            status: { const: granted }
            granted_at: { type: string, format: date-time }
            ui_surface: { type: string, enum: [onboarding, privacy_center] }
          required: [status, granted_at, ui_surface]
        - properties:
            status: { const: not_granted }
            granted_at: { type: 'null' }
            ui_surface: { type: 'null' }
          required: [status, granted_at, ui_surface]
    ReadingHistoryItem:
      type: object
      additionalProperties: false
      required:
        [reading_id, local_date, revision, revision_reason, status,
         assembly_mode, headline, saved, saved_at, evidence_url]
      properties:
        reading_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9_.:-]+$'
        local_date: { type: string, format: date }
        revision: { type: integer, minimum: 1 }
        revision_reason:
          type: string
          enum:
            [initial, chart_recalculated, consent_revoked, safety_correction,
             defect_repair]
        status: { type: string, enum: [published, superseded, invalidated] }
        assembly_mode: { type: string, enum: [deterministic, constrained_model] }
        headline: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        saved: { type: boolean }
        saved_at: { type: [string, 'null'], format: date-time }
        evidence_url:
          type: string
          minLength: 1
          maxLength: 512
          format: uri-reference
          pattern: '^/v1/readings/[A-Za-z0-9_.:-]+/evidence$'
      oneOf:
        - properties:
            saved: { const: true }
            saved_at: { type: string, format: date-time }
          required: [saved, saved_at]
        - properties:
            saved: { const: false }
            saved_at: { type: 'null' }
          required: [saved, saved_at]
    ReadingHistoryResponse:
      type: object
      additionalProperties: false
      required: [schema_version, view, items, next_cursor]
      properties:
        schema_version: { type: string, const: '0.8.0' }
        view: { type: string, enum: [history, saved] }
        items:
          type: array
          minItems: 0
          maxItems: 50
          items: { $ref: '#/components/schemas/ReadingHistoryItem' }
        next_cursor:
          type: [string, 'null']
          minLength: 1
          maxLength: 2048
          pattern: '^[A-Za-z0-9_-]+$'
      allOf:
        - if:
            properties: { view: { const: saved } }
            required: [view]
          then:
            properties:
              items:
                items:
                  properties:
                    saved: { const: true }
                    saved_at: { type: string, format: date-time }
                  required: [saved, saved_at]
    ReadingSaveState:
      type: object
      additionalProperties: false
      required: [schema_version, reading_id, saved, saved_at]
      properties:
        schema_version: { type: string, const: '0.8.0' }
        reading_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9_.:-]+$'
        saved: { type: boolean }
        saved_at: { type: [string, 'null'], format: date-time }
      oneOf:
        - properties:
            saved: { const: true }
            saved_at: { type: string, format: date-time }
          required: [saved, saved_at]
        - properties:
            saved: { const: false }
            saved_at: { type: 'null' }
          required: [saved, saved_at]
    ReadingDetailResponse:
      oneOf:
        - { $ref: '../../m3/daily-reading.schema.json#/$defs/dailyReadingResponse' }
        - { $ref: '../../m5/daily-reading.schema.json#/$defs/dailyReadingResponseV5' }
      x-normative-m3-schema: 'm3:daily-reading.schema.json#/$defs/dailyReadingResponse'
      x-normative-m5-schema: 'm5:daily-reading.schema.json#/$defs/dailyReadingResponseV5'
    TimezoneQualifier:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - pre_1970_zone_boundary
            - near_zone_boundary
            - hint_replaced
            - no_coordinates
            - nautical_zone
            - local_time_ambiguous
            - local_time_nonexistent
        message: { type: string }
    BirthProfileRequest:
      type: object
      additionalProperties: false
      required: [accuracy, consent_id]
      properties:
        accuracy: { type: string, enum: [exact, approximate, unknown] }
        birth_date: { type: string, format: date }
        birth_time_local: { type: [string, 'null'] }
        approximate_window_minutes:
          type: [integer, 'null']
          minimum: 1
        birthplace:
          type: object
          additionalProperties: false
          properties:
            label: { type: string }
            place_id: { type: [string, 'null'] }
            latitude: { type: [number, 'null'] }
            longitude: { type: [number, 'null'] }
        timezone_hint: { type: [string, 'null'] }
        consent_id: { type: string, minLength: 8 }
    BirthProfileAccepted:
      type: object
      additionalProperties: false
      required: [schema_version, workflow, status, idempotency_key]
      properties:
        schema_version: { type: string, const: '0.2.0' }
        workflow:
          type: string
          enum:
            [NormalizeBirthAndCalculateChart, GenerateDailyReading,
             PublishContentRelease, ExportAccount, DeleteAccount,
             RefreshConnector]
        status: { type: string, enum: [queued, running, succeeded, duplicate] }
        idempotency_key: { type: string }
        job_id: { type: [string, 'null'] }
        resource_id: { type: [string, 'null'] }
        timezone:
          type: object
          additionalProperties: false
          required: [resolved, source, confidence, qualifiers]
          properties:
            resolved: { type: string }
            source: { type: string, enum: [coordinates, hint, default] }
            confidence: { type: string, enum: [high, medium, low, none] }
            hint_overridden: { type: [string, 'null'] }
            qualifiers:
              type: array
              items: { $ref: '#/components/schemas/TimezoneQualifier' }
        chart:
          type: object
          additionalProperties: true
          properties:
            id: { type: string }
            fingerprint: { type: string }
            contract_id: { type: string }
            status: { type: string, enum: [active, superseded, invalid] }
            uncertainty:
              type: object
              additionalProperties: true
    BirthCalcBudgetExhausted:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, details]
          properties:
            code: { type: string, const: birth_calc_budget_exhausted }
            message:
              type: string
              const: The daily birth calculation limit has been reached
            request_id:
              type: string
              minLength: 8
              maxLength: 128
              pattern: '^[A-Za-z0-9_.:-]+$'
            details:
              type: object
              additionalProperties: false
              required: [resets_at]
              properties:
                resets_at: { type: string, format: date-time }

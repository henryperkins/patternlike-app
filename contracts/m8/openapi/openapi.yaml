            required: [artifact_id, artifact_class, created_at, expires_at, deleted_at]
            properties:
              artifact_id: { type: string, pattern: '^part_[0-9a-f]{32}$' }
              artifact_class:
                type: string
                enum:
                  - fact_packet
                  - planner_request
                  - planner_response
                  - validated_plan
                  - writer_request
                  - writer_response
                  - rejected_candidate
                  - candidate_validation
                  - verifier_request
                  - verifier_response
                  - semantic_verdict
                  - accepted_internal_document
              created_at: { type: string, format: date-time }
              expires_at: { type: string, format: date-time }
              deleted_at: { type: [string, 'null'], format: date-time }
    PatternAdminArtifact:
      type: object
      additionalProperties: false
      required: [schema_version, generation_id, artifact_id, artifact_class, created_at, expires_at, content]
      properties:
        schema_version: { type: string, const: '0.7.0' }
        generation_id: { type: string, pattern: '^pgen_[0-9a-f]{32}$' }
        artifact_id: { type: string, pattern: '^part_[0-9a-f]{32}$' }
        artifact_class:
          type: string
          enum:
            - fact_packet
            - planner_request
            - planner_response
            - validated_plan
            - writer_request
            - writer_response
            - rejected_candidate
            - candidate_validation
            - verifier_request
            - verifier_response
            - semantic_verdict
            - accepted_internal_document
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        content: { type: object }
    PatternAdminOntologyRelease:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - ontology_version
        - status
        - bundle_hash
        - corpus_release_hash
        - locale
        - provenance_origin
        - record_count
        - evaluation
      properties:
        schema_version: { type: string, const: '0.7.0' }
        ontology_version: { type: string, minLength: 1 }
        status: { type: string, enum: [candidate, active, superseded, recalled] }
        bundle_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        corpus_release_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        locale:
          type: string
          minLength: 2
          maxLength: 35
          pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]+)*$'
        provenance_origin:
          type: string
          enum: [synthetic_internal, machine_pipeline, absent]
        record_count: { type: integer, minimum: 0 }
        evaluation:
          type: object
          additionalProperties: false
          required:
            - schema_version
            - ontology_version
            - verdict
            - compiler_passed
            - evaluator_passed
            - regression_passed
            - unevaluated_fixture_count
          properties:
            schema_version: { type: string, const: '0.7.0' }
            ontology_version: { type: string, minLength: 1 }
            verdict: { type: string, enum: [pass, reject] }
            compiler_passed: { type: boolean }
            evaluator_passed: { type: boolean }
            regression_passed: { type: boolean }
            unevaluated_fixture_count: { type: integer, minimum: 0 }
            evaluation_report_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            regression_report_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    PlaceSearchRequest:
      type: object
      additionalProperties: false

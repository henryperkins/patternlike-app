openapi: 3.1.0
info:
  title: Pattern-Like Astrology App API (M8 amendment)
  version: 0.8.0
  description: |
    Additive M8 consumer surfaces for birthplace search, revocable geocoder
    consent, reading History and Saved views, revision-specific Save state,
    portable Save metadata, and the birth calculation budget. The complete M7
    API is retained unchanged; frozen M0-M7 documents remain valid.
servers:
  - url: https://patternlike-api-production.lfd.workers.dev
  - url: http://localhost:8787
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /v1/pattern-state:
    get:
      operationId: getPatternState
      x-normative-schema: 'm7:pattern-state.schema.json#/$defs/patternStateDocument'
      responses:
        '200':
          description: Closed Pattern state for the current account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternState' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/consents/pattern-generation:
    get:
      operationId: getPatternGenerationConsent
      x-normative-schema: 'm7:pattern-consent.schema.json#/$defs/patternConsent'
      responses:
        '200':
          description: Current Pattern-generation terms and grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternConsent' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      operationId: revokePatternGenerationConsent
      x-normative-schema: 'm7:pattern-consent.schema.json#/$defs/patternConsentRevocation'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Consent revoked; whether an accepted Pattern was retained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternConsentRevocation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/pattern-generations:
    post:
      operationId: startPatternGeneration
      x-normative-schema: 'm7:pattern-generation-request.schema.json#/$defs/patternGenerationRequest'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatternGenerationRequest' }
      responses:
        '202':
          description: Consent granted or observed and generation reserved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternGenerationAccepted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/pattern-generations/{generation_id}:
    get:
      operationId: getPatternGeneration
      x-normative-schema: 'm7:pattern-generation-status.schema.json#/$defs/patternGenerationStatus'
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: Owner-scoped generation status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternGenerationStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/pattern:
    get:
      operationId: getGeneratedPattern
      x-normative-schema: 'm7:pattern-response.schema.json#/$defs/patternResponse'
      responses:
        '200':
          description: One immutable AI Pattern document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteGeneratedPattern
      x-normative-schema: 'm7:pattern-delete-request.schema.json#/$defs/patternDeleteRequest'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatternDeleteRequest' }
      responses:
        '202':
          description: Pattern made inaccessible; physical artifact deletion may continue
        '204':
          description: Pattern already erased
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /internal/pattern-ontology-releases:
    post:
      operationId: ingestPatternOntologyRelease
      security:
        - serviceToken: []
      x-normative-schema: 'm7:pattern-ontology-release.schema.json#/$defs/patternOntologyRelease'
      responses:
        '201': { description: Ontology release stored }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /internal/pattern-ontology-releases/{version}/recall:
    post:
      operationId: recallPatternOntologyRelease
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/OntologyVersion'
      responses:
        '200': { description: Release recalled; accepted Patterns withdrawn }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /internal/pattern-generations/{generation_id}/reconcile:
    post:
      operationId: reconcilePatternGeneration
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '202': { description: Generation reconciliation accepted }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/pattern-generations/{generation_id}:
    get:
      operationId: adminGetPatternGeneration
      security:
        - adminSession: []
      x-normative-schema: 'm7:pattern-admin-generation.schema.json#/$defs/patternAdminGeneration'
      parameters:
        - $ref: '#/components/parameters/GenerationId'
        - $ref: '#/components/parameters/AdminPurpose'
      responses:
        '200':
          description: Generation metadata; does not open exact content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternAdminGeneration' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/pattern-generations/{generation_id}/artifacts:
    get:
      operationId: adminListPatternArtifacts
      security:
        - adminSession: []
      x-normative-schema: 'm7:pattern-admin-artifact-inventory.schema.json#/$defs/patternAdminArtifactInventory'
      parameters:
        - $ref: '#/components/parameters/GenerationId'
        - $ref: '#/components/parameters/AdminPurpose'
      responses:
        '200':
          description: Artifact inventory; does not open exact content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternAdminArtifactInventory' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/pattern-generations/{generation_id}/artifacts/{artifact_id}:
    get:
      operationId: adminGetPatternArtifact
      security:
        - adminSession: []
      x-normative-schema: 'm7:pattern-admin-artifact.schema.json#/$defs/patternAdminArtifact'
      parameters:
        - $ref: '#/components/parameters/GenerationId'
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/AdminPurpose'
      responses:
        '200':
          description: Decrypted artifact; a separate auditable action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternAdminArtifact' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/pattern-ontology-releases/{version}:
    get:
      operationId: adminGetPatternOntologyRelease
      security:
        - adminSession: []
      x-normative-schema: 'm7:pattern-admin-ontology-release.schema.json#/$defs/patternAdminOntologyRelease'
      parameters:
        - $ref: '#/components/parameters/OntologyVersion'
        - $ref: '#/components/parameters/AdminPurpose'
      responses:
        '200':
          description: Ontology release metadata; does not return record bodies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternAdminOntologyRelease' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/places/search:
    post:
      tags: [places]
      operationId: searchPlaces
      summary: Search provider-neutral birthplace suggestions
      x-normative-request-schema: 'm8:place-search.schema.json#/$defs/placeSearchRequest'
      x-normative-response-schema: 'm8:place-search.schema.json#/$defs/placeSearchResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceSearchRequest' }
      responses:
        '200':
          description: At most eight provider-neutral suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceSearchResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/places/resolve:
    post:
      tags: [places]
      operationId: resolvePlace
      summary: Resolve one selected suggestion to an app-owned place
      x-normative-request-schema: 'm8:place-resolution.schema.json#/$defs/placeResolutionRequest'
      x-normative-response-schema: 'm8:place-resolution.schema.json#/$defs/placeResolutionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceResolutionRequest' }
      responses:
        '200':
          description: Selected place projected without provider metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceResolutionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/consents/geocoder:
    get:
      tags: [consents]
      operationId: getGeocoderConsent
      x-normative-schema: 'm8:geocoder-consent.schema.json#/$defs/geocoderConsentResponse'
      responses:
        '200':
          description: Current server-owned disclosure and grant state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeocoderConsent' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      tags: [consents]
      operationId: grantGeocoderConsent
      x-normative-request-schema: 'm8:geocoder-consent.schema.json#/$defs/geocoderConsentGrantRequest'
      x-normative-response-schema: 'm8:geocoder-consent.schema.json#/$defs/geocoderConsentResponse'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsentUiSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeocoderConsentGrant' }
      responses:
        '200':
          description: Current policy granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeocoderConsent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: consent_policy_version_stale or idempotency conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [consents]
      operationId: revokeGeocoderConsent
      x-normative-schema: 'm8:geocoder-consent.schema.json#/$defs/geocoderConsentResponse'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsentUiSurface'
      responses:
        '200':
          description: Consent withdrawn and current not-granted state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeocoderConsent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/consents/account-processing:
    get:
      tags: [consents]
      operationId: getAccountProcessingConsent
      x-normative-schema: 'm8:account-processing-consent.schema.json#/$defs/accountProcessingConsentResponse'
      responses:
        '200':
          description: Current server-owned disclosure, grant, and recovery state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProcessingConsent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      tags: [consents]
      operationId: grantAccountProcessingConsent
      x-normative-request-schema: 'm8:account-processing-consent.schema.json#/$defs/accountProcessingConsentGrantRequest'
      x-normative-response-schema: 'm8:account-processing-consent.schema.json#/$defs/accountProcessingConsentResponse'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsentUiSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountProcessingConsentGrant' }
      responses:
        '200':
          description: Current policy granted or regranted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProcessingConsent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: consent_policy_version_stale, account_state_conflict, consent_conflict, or idempotency conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [consents]
      operationId: revokeAccountProcessingConsent
      x-normative-schema: 'm8:account-processing-consent.schema.json#/$defs/accountProcessingConsentResponse'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsentUiSurface'
      responses:
        '200':
          description: Current account-processing state after revocation or no-op
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProcessingConsent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/readings:
    get:
      tags: [readings]
      operationId: listReadingHistory
      x-normative-schema: 'm8:reading-history.schema.json#/$defs/readingHistoryResponse'
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [history, saved]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: One bounded History or Saved page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingHistoryResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/readings/{reading_id}:
    get:
      tags: [readings]
      operationId: getReadingById
      parameters:
        - $ref: '#/components/parameters/ReadingId'
      responses:
        '200':
          description: The immutable stored revision through its frozen reader
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingDetailResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/readings/{reading_id}/save:
    get:
      tags: [readings]
      operationId: getReadingSaveState
      x-normative-schema: 'm8:reading-save-state.schema.json#/$defs/readingSaveState'
      parameters:
        - $ref: '#/components/parameters/ReadingId'
      responses:
        '200':
          description: Revision-specific Save state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingSaveState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [readings]
      operationId: saveReading
      x-normative-schema: 'm8:reading-save-state.schema.json#/$defs/readingSaveState'
      description: Empty-body idempotent desired-state operation.
      parameters:
        - $ref: '#/components/parameters/ReadingId'
      responses:
        '200':
          description: Saved, preserving the original saved_at on repetition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingSaveState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [readings]
      operationId: unsaveReading
      description: Empty-body idempotent delete; unknown and foreign ids do not disclose existence.
      parameters:
        - $ref: '#/components/parameters/ReadingId'
      responses:
        '204': { description: Save state absent }
        '401': { $ref: '#/components/responses/Error' }
  /v1/birth-profiles:
    post:
      tags: [birth]
      operationId: createOrUpdateBirthProfile
      summary: Create/update a birth profile and start calculation
      x-normative-budget-schema: 'm8:common.schema.json#/$defs/birthCalcBudgetExhausted'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BirthProfileRequest' }
      responses:
        '202':
          description: Profile accepted; calculation workflow started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BirthProfileAccepted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429':
          description: Per-user UTC-day birth calculation budget exhausted
          headers:
            Retry-After:
              description: Seconds until the next UTC day
              schema: { type: integer, minimum: 0 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BirthCalcBudgetExhausted' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pl_session
    bearerAuth:
      type: http
      scheme: bearer
    serviceToken:
      type: http
      scheme: bearer
    adminToken:
      type: http
      scheme: bearer
      description: >
        Deprecated transitional shared secret. Slice C deletes this scheme
        together with PATTERN_ADMIN_TOKEN. New admin paths use adminSession.
    adminSession:
      type: apiKey
      in: cookie
      name: pl_admin_session
      description: >
        Specified administrator session. HttpOnly, Secure, SameSite=Strict,
        Path=/admin. Minted by Cloudflare Access or a separate administrator
        OIDC tenant; the operator has not chosen which.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    GenerationId:
      name: generation_id
      in: path
      required: true
      schema: { type: string, pattern: '^pgen_[0-9a-f]{32}$' }
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: { type: string, pattern: '^part_[0-9a-f]{32}$' }
    OntologyVersion:
      name: version
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    AdminPurpose:
      name: purpose
      in: query
      required: true
      schema:
        type: string
        enum: [quality_review, safety_investigation, incident_response, retention_audit]
    ConsentUiSurface:
      name: X-Consent-UI-Surface
      in: header
      required: true
      schema:
        type: string
        enum: [onboarding, privacy_center]
    ReadingId:
      name: reading_id
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9_.:-]+$'
  responses:
    Error:
      description: Existing request-id error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: true
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: [string, 'null'] }
    PatternState:
      type: object
      additionalProperties: true
      required: [schema_version, state]
      properties:
        schema_version: { type: string, const: '0.7.0' }
        state: { type: string }
    PatternConsent:
      type: object
      additionalProperties: true
      description: >-
        Pattern-generation terms and grant. `provider` is the PROCESSOR of
        record and stays `OpenAI`; the generation service it runs the passes
        through is named separately in the reader-facing copy, because a reader
        told only the processor cannot tell which service writes their Pattern.
        `policy_version` is versioned independently of `schema_version`: the
        wire shape and what the reader was told are different things, and a
        grant stored under any version other than the current one is not an
        active grant.
      required: [schema_version, kind, status]
      properties:
        schema_version: { type: string, const: '0.7.0' }
        kind: { type: string, const: 'pattern_generation' }
        status: { type: string }
    PatternConsentRevocation:
      type: object
      additionalProperties: false
      required: [schema_version, consent, existing_pattern_retained]
      properties:
        schema_version: { type: string, const: '0.7.0' }
        consent: { $ref: '#/components/schemas/PatternConsent' }
        existing_pattern_retained: { type: boolean }
    PatternGenerationRequest:
      type: object
      additionalProperties: false
      required: [schema_version, consent_policy_version, confirm, reason]
      properties:
        schema_version: { type: string, const: '0.7.0' }
        consent_policy_version:
          type: string
          description: >-
            The policy version the reader was shown. A request naming any
            version other than the one currently in force is
            `409 consent_policy_version_stale`, so a client cannot confirm
            against copy the deployment has superseded.
        confirm: { type: string, const: 'GENERATE MY PATTERN' }
        reason: { type: string }
    PatternGenerationAccepted:
      type: object
      additionalProperties: true
      required: [schema_version, consent, generation]

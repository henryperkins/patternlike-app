# fly.toml app configuration file generated for patternlike-app on 2026-08-08T18:08:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'patternlike-app'
primary_region = 'ord'

[build]
  dockerfile = 'apps/calc-stub/Dockerfile'

[env]
  ENVIRONMENT = 'production'
  NODE_ENV = 'production'
  PORT = '8080'
  SE_EPHE_PATH = '/app/data/ephe'
  SE_LICENSE_MODE = 'agpl'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

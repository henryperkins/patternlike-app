# fly.toml app configuration file generated for patternlike-calc on 2026-08-04T02:32:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "patternlike-calc"
primary_region = 'iad'

[build]
  dockerfile = "apps/calc-stub/Dockerfile"

[env]
  PORT            = "8080"
  NODE_ENV        = "production"
  ENVIRONMENT     = "production"
  SE_LICENSE_MODE = "agpl"
  SE_EPHE_PATH    = "/app/data/ephe"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2
  checks = [{ grace_period = '10s', interval = '30s', method = 'GET', path = '/', timeout = '5s' }]

  [[http_service.checks]]
    method       = "GET"
    path         = "/health"
    interval     = "30s"
    timeout      = "5s"
    grace_period = "30s"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

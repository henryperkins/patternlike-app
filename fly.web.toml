# Fly.io configuration for the web PWA (apps/web), served as static files.
#
# Deploy from the repository ROOT (the Docker build context must be the root):
#   fly deploy -c fly.web.toml
#
# The calc service deploys separately via fly.toml (app "patternlike-calc").

app = "patternlike-app"
# ord, not iad: Fly Launch created this app's machines in ord, and the primary
# region is what autostart/autostop and `fly scale count` reason about. A value
# naming a region with no machines makes "keep N running in the primary region"
# mean nothing. Change this only alongside actually moving the machines.
primary_region = "ord"

[build]
  dockerfile = "apps/web/Dockerfile"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method       = "GET"
    path         = "/"
    interval     = "30s"
    timeout      = "5s"
    grace_period = "10s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

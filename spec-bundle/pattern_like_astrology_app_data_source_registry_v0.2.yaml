schema_version: '0.2'
document_date: '2026-07-30'
product:
  name: Pattern-Like Astrology App
  positioning: Pattern-like psychological timing app with Swiss Ephemeris as the calculation authority.
  scope_statement: The catalog is exhaustive by feasible source class for a consumer mobile app, with representative
    provider adapters. It is not a claim that every vendor-specific API is listed.
  architecture_profile: cloudflare-first-wordpress-editorial-fly-portable-v1
  normative_documents:
  - pattern_like_astrology_app_product_platform_spec_v0.2.docx
  - pattern_like_astrology_app_product_platform_spec_v0.2.md
  - pattern_like_astrology_app_platform_topology_v0.2.yaml
evidence_lanes:
  celestial_facts:
    may:
    - create interpretation eligibility
    - determine cycle timing
    - support chart evidence
    may_not:
    - make guaranteed predictions
    - diagnose
    - claim external causation
  user_and_context:
    may:
    - rank valid themes
    - select life domain
    - adapt tone
    - choose reflection prompt
    - choose delivery time
    may_not:
    - change chart facts
    - be laundered as an astrological prediction
    - infer protected traits
  operational:
    may:
    - deliver, cache, localize, gate, retry, and audit
    may_not:
    - alter interpretive substance
allowed_use_vocabulary:
- annual_context
- chart_fact
- consent_validation
- content_quality
- content_safety
- cycle_detection
- editorial_context
- editorial_research
- environment_context
- evidence_graph
- experimental_context
- feature_gating
- journal_import
- life_domain_selection

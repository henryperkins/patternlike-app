platform_policy:
  primary_runtime: Cloudflare Workers, Workflows, Queues, D1, R2, and Containers
  editorial_control_plane: WordPress.com custom plugin and REST-exposed content types
  portable_compute_plane: Fly.io Machines using the same OCI image as the Cloudflare calculation container
  database_launch_choice: Cloudflare D1 with application-layer envelope encryption
  database_migration_option: Fly.io Managed Postgres behind a Fly-hosted data service; not directly exposed to clients
  user_data_boundary: No birth, journal, relationship, health, or reading records stored in WordPress.com
  llm_boundary: Optional; approved fragments only; AI Gateway logging disabled for private requests; deterministic
    fallback mandatory

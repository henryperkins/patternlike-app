- reflection_prompt
- relationship_interpretation
- rendering
- repetition_control
- reproducibility
- routine_context
- supportability
- sync_scheduling
- theme_eligibility
- theme_filtering
- theme_ranking
- time_travel
- timezone_resolution
- tone
- travel_context
- uncertainty_model
- user_memory
- weather_lookup
- workload_context
permission_tiers:
- tier: 0
  name: Calculation minimum
  default: required
  sources:
  - AST-01
  - AST-02
  - AST-03
  - AST-04
  - AST-05
  - AST-06
  - AST-08
  - AST-20
- tier: 1
  name: First-party reflective context
  default: explicit app controls
  sources:
  - USR-01 through USR-17
- tier: 2
  name: Low-content situational context
  default: optional opt-in
  sources:
  - DEV-01 through DEV-07
  - CLD-01
  - CLD-02
  - AMB-01 through AMB-07
- tier: 3
  name: Sensitive wellness and behavior
  default: off; separate consent
  sources:
  - DEV-08 through DEV-12
  - CLD-08 through CLD-16
- tier: 4
  name: Prohibited or unacceptable tradeoff
  default: never
  sources:
  - NO-01 through NO-24
sources:
- id: AST-01
  name: Birth profile
  category: A. Calculation authority and astrological sources
  automated_data: Birth date, local birth time, time-accuracy class, birthplace label, and user-entered corrections.
  acquisition: Explicit onboarding form; optionally imported from a user-selected record.
  cadence: On create and user edit
  sensitivity: highly_sensitive
  confidence: user_confirmed
  allowed_uses:
  - chart_fact
  - cycle_detection
  - uncertainty_model
  prohibited_uses:
  - alter_chart_fact
  - diagnose_or_treat
  - guaranteed_prediction
  - infer_protected_trait
  - ad_targeting
  status: required
  phase: launch
  raw_retention: Until account deletion or profile replacement
  notes: Unknown time is a first-class mode; never silently substitute noon.
  implementation:
    ingestion_owner: profile-service
    primary_runtime: cloudflare-api-worker
    primary_storage:
    - 'd1: encrypted operational record'
    - 'r2: immutable snapshot or rendered artifact'
    delivery_path: source -> normalized ContextSignal -> eligibility/ranking policy -> reading evidence
